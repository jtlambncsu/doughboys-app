<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fork.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="An unofficial, fan-made companion to the Doughboys podcast. Not affiliated with the show."
    />
    <title>Doughboys App (unofficial fan app)</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf7f2" />
    <!-- Link previews (texts, email, social). Our own art only, never the show's. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doughboys App (unofficial fan app)" />
    <meta property="og:title" content="Doughboys App (unofficial fan app)" />
    <meta
      property="og:description"
      content="Every chain the Doughboys have reviewed, ranked by forks. A fan-made companion; not affiliated with the show."
    />
    <meta property="og:url" content="https://www.doughboysapp.com/" />
    <meta property="og:image" content="https://www.doughboysapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Doughboys App, unofficial fan app: every chain the Doughboys have reviewed, ranked by forks."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Follow the device's light/dark setting before the app loads, so there's no flash.
      const darkMedia = matchMedia('(prefers-color-scheme: dark)');
      const applyTheme = () => document.documentElement.classList.toggle('dark', darkMedia.matches);
      applyTheme();
      darkMedia.addEventListener('change', applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
