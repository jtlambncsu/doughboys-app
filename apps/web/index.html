<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fork.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A fan-made companion to the Doughboys podcast." />
    <title>Fork Report</title>
    <script>
      // Follow the device's light/dark setting before the app loads, so there's no flash.
      const darkMedia = matchMedia('(prefers-color-scheme: dark)');
      const applyTheme = () => document.documentElement.classList.toggle('dark', darkMedia.matches);
      applyTheme();
      darkMedia.addEventListener('change', applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
